services:
  
  migrate:
    build: .
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    network_mode: host
    
  api:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    container_name: "landing_api"
    network_mode: host

